org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Zéro Perte : même numéro de version (versionCode) pour l'APK universel et les APK
# par processeur. Sans cela, Flutter ajoute 1000/2000 au numéro des APK par processeur,
# et un téléphone mis à jour par un APK arm64 refuserait ensuite un APK universel
# plus récent reçu par WhatsApp (« rétrogradation »).
force-version-code-ignoring-abi=true

name: "1 - Créer la clé de signature (une seule fois)"

# À lancer UNE SEULE FOIS par le propriétaire, après avoir créé le secret
# ZP_SIGNATURE_MOT_DE_PASSE. Ce workflow :
#  1. crée la clé de signature officielle ;
#  2. l'enregistre CHIFFRÉE dans le dépôt (signature/cle-signature.p12.chiffre) ;
#  3. met une copie de secours chiffrée à télécharger (à garder dans Google Drive) ;
#  4. relance la fabrication de l'APK, cette fois signé officiellement.
# La clé en clair n'apparaît jamais : ni dans le dépôt, ni dans les journaux.
# Il refuse de remplacer une clé existante.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écrivez OUI en majuscules pour confirmer"
        required: true
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: creer-cle-signature
  cancel-in-progress: false

jobs:
  creer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Contrôles avant création
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Lancez ce workflow sur la branche main."
            exit 1
          fi
          if [ "${{ github.event.inputs.confirmation }}" != "OUI" ]; then
            echo "::error::Confirmation absente : écrivez OUI en majuscules."
            exit 1
          fi

      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Créer et chiffrer la clé
        env:
          ZP_SIGNATURE_MOT_DE_PASSE: ${{ secrets.ZP_SIGNATURE_MOT_DE_PASSE }}
        run: |
          ./outils/creer-cle-signature.sh signature/cle-signature.p12.chiffre | tee "$RUNNER_TEMP/resultat.txt"

      - name: Enregistrer la clé chiffrée dans le dépôt
        run: |
          git config user.name "zero-perte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signature/cle-signature.p12.chiffre
          git commit -m "Ajout de la clé de signature officielle (chiffrée)"
          git push origin HEAD:main

      - name: Copie de secours chiffrée (à garder dans Google Drive)
        uses: actions/upload-artifact@v4
        with:
          name: copie-de-secours-cle-chiffree
          path: signature/cle-signature.p12.chiffre
          retention-days: 90

      - name: Relancer la fabrication de l'APK officiel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fabriquer-apk.yml --ref main

      - name: Résumé
        run: |
          {
            echo "## ✅ Clé de signature créée"
            echo ""
            echo "- La clé est enregistrée **chiffrée** dans \`signature/cle-signature.p12.chiffre\`."
            echo "- **Téléchargez la copie de secours** ci-dessous (« copie-de-secours-cle-chiffree ») et rangez-la dans votre Google Drive."
            echo "- Gardez le **mot de passe** sur papier, à part : sans lui, la copie ne sert à rien. GitHub ne peut pas le réafficher."
            echo "- La fabrication de l'APK officiel a été relancée automatiquement."
            echo ""
            echo "Empreintes **publiques** du certificat (pas secrètes, utiles plus tard pour Google Cloud) :"
            echo '```'
            grep "Empreinte" "$RUNNER_TEMP/resultat.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

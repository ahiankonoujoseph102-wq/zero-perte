name: "6 - Fabriquer la voix de la démonstration"

# Fabrique une seule fois la voix d'Afi (démonstration guidée) avec un service
# d'intelligence artificielle, à partir de docs/demo/texte-voix.md :
#  - Gemini en premier choix (secret ZP_CLE_VOIX), OpenAI en secours
#    (secret facultatif ZP_CLE_VOIX_SECOURS, ou ZP_CLE_VOIX commençant par sk-) ;
#  - fichiers MP3 mono 24 kbit/s (lus par Android 8 et Windows sans
#    bibliothèque), mouvement et forme de la bouche calculés d'avance
#    (assets/demo/voix/bouches.json) ;
#  - mode « extraits » : la phrase d'accueil avec 3 voix, publiée sur le site
#    (…/zero-perte/voix/) pour choisir à l'écoute.
# La voix complète est poussée sur la branche « voix-demonstration » (jamais
# sur main directement) : Claude la vérifie, puis la fusionne.
# Les clés ne sont jamais affichées ni écrites.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "extraits = 3 voix à écouter (site) ; voix = toute la démonstration"
        type: choice
        options: ["extraits", "voix"]
        default: "extraits"
      essai:
        description: "oui = sons de test sans service d'IA (pour vérifier la chaîne)"
        type: choice
        options: ["non", "oui"]
        default: "non"

permissions:
  contents: write
  actions: write # relancer la publication du site (extraits)

concurrency:
  group: fabriquer-voix
  cancel-in-progress: false

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Contrôler la clé (sans l'afficher)
        env:
          CLE_PRESENTE: ${{ secrets.ZP_CLE_VOIX != '' }}
          SECOURS_PRESENT: ${{ secrets.ZP_CLE_VOIX_SECOURS != '' }}
        run: |
          if [ "${{ github.event.inputs.essai }}" = "oui" ]; then
            echo "Essai : sons de test, aucun service d'IA."
          elif [ "$CLE_PRESENTE" != "true" ]; then
            echo "::error::Le secret ZP_CLE_VOIX est absent (docs/etapes-proprietaire.md, partie H)."
            exit 1
          else
            echo "ZP_CLE_VOIX : présent. Secours OpenAI : $SECOURS_PRESENT."
          fi

      - name: Installer ffmpeg (MP3)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libmp3lame

      - name: "Voix : reprendre ce qui est déjà fait"
        if: github.event.inputs.mode == 'voix'
        run: |
          # Les phrases déjà fabriquées (quota du jour atteint la veille) sont
          # sur la branche voix-demonstration : on les reprend.
          if git fetch -q origin voix-demonstration 2>/dev/null; then
            git checkout FETCH_HEAD -- assets/demo/voix && git reset -q
            echo "Reprise depuis voix-demonstration."
          else
            echo "Première fabrication."
          fi

      - name: Fabriquer la voix
        env:
          ZP_CLE_VOIX: ${{ secrets.ZP_CLE_VOIX }}
          ZP_CLE_VOIX_SECOURS: ${{ secrets.ZP_CLE_VOIX_SECOURS }}
          ZP_VOIX_MODELE: ${{ vars.ZP_VOIX_MODELE }}
          ZP_VOIX_NOM: ${{ vars.ZP_VOIX_NOM }}
        run: |
          set -o pipefail
          ARGS=()
          [ "${{ github.event.inputs.essai }}" = "oui" ] && ARGS+=(--essai)
          [ "${{ github.event.inputs.mode }}" = "extraits" ] && ARGS+=(--extraits)
          python3 outils/voix/fabriquer_voix.py "${ARGS[@]}" | tee "$RUNNER_TEMP/voix.txt"
          du -sh assets/demo/voix docs/site/voix 2>/dev/null || true

      - name: "Extraits : publier sur le site"
        if: github.event.inputs.mode == 'extraits'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "zero-perte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Seulement les extraits (docs/site/voix) vont sur main : rien
          # d'autre de la branche lancée.
          cp -r docs/site/voix "$RUNNER_TEMP/voix"
          git stash --include-untracked -q || true
          git checkout -q -B extraits origin/main
          rm -rf docs/site/voix && cp -r "$RUNNER_TEMP/voix" docs/site/voix
          git add docs/site/voix
          git commit -m "Extraits de voix pour choisir la voix d'Afi (action 6) [skip ci]" || { echo "Rien de nouveau."; exit 0; }
          git push origin HEAD:main
          gh workflow run publier-site.yml --ref main
          {
            echo "## Extraits de voix"
            echo ""
            tail -n 1 "$RUNNER_TEMP/voix.txt"
            echo ""
            echo "À écouter dans quelques minutes : https://ahiankonoujoseph102-wq.github.io/zero-perte/voix/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pousser sur la branche voix-demonstration
        if: github.event.inputs.mode == 'voix'
        run: |
          git config user.name "zero-perte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ETAT=$(grep -o "Voix [^:]*: [0-9]*/[0-9]*" "$RUNNER_TEMP/voix.txt" | tail -n 1 || true)
          # Seul le dossier de la voix va sur la branche voix-demonstration.
          cp -r assets/demo/voix "$RUNNER_TEMP/voix-faite"
          git reset -q --hard
          git clean -fdq assets/demo/voix
          if git fetch -q origin voix-demonstration 2>/dev/null; then
            git checkout -q -B voix-demonstration FETCH_HEAD
          else
            git checkout -q -B voix-demonstration
          fi
          rm -rf assets/demo/voix && cp -r "$RUNNER_TEMP/voix-faite" assets/demo/voix
          git add -A assets/demo/voix
          git commit -q -m "${ETAT:-Voix} (action 6) [skip ci]" || { echo "Rien de nouveau."; exit 0; }
          git push origin voix-demonstration

      - name: Résumé
        if: github.event.inputs.mode == 'voix'
        run: |
          {
            echo "## Voix de la démonstration"
            echo ""
            tail -n 1 "$RUNNER_TEMP/voix.txt"
            echo ""
            echo "Fichiers poussés sur la branche **voix-demonstration**. Dites à Claude « la voix est prête » :"
            echo "il vérifie, fabrique la nouvelle version et la publie."
          } >> "$GITHUB_STEP_SUMMARY"
